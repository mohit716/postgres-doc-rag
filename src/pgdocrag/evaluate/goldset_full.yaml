# Full-corpus retrieval gold set.
#
# Written for the whole manual, unlike goldset.yaml, which targets configuration
# parameters almost exclusively. Both are kept: this one measures breadth, that
# one is a focused stress test on a single dense topic.
#
# Expectations:
#   expect_anchor / expect_anchors  section anchor(s), e.g. INDEXES-PARTIAL
#   expect_path   / expect_paths    substring(s) of the chunk breadcrumb
#
# A result is relevant when it matches ANY listed expectation. Two reasons for
# the plural forms. First, a section split across several chunks has several
# equally correct answers, and scoring the second one as a miss understates
# retrieval. Second, HTML anchors do not exist in the PDF, whose breadcrumbs are
# leaf-scoped; a section-title path matches both formats, so the same set can
# score either one. Titles are only used where they resolve to at most ~30 chunks
# in both formats — a looser label would stop being evidence.
#
# Pages that publish only content-addressed anchors (#id-1.9.3.35.5) are labelled
# by breadcrumb alone, since those ids are not stable across releases.
#
# Questions are phrased as a user would ask them, deliberately avoiding the
# target's own vocabulary. Verify with:
#   python scripts/build_goldset.py verify --goldset full

